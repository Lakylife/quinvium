# Container image of the full node: built and started on every pull request (nothing is published),
# published to ghcr.io/lakylife/quinvium-node for every release tag v*.
# Only docker itself is used (no third-party actions); the image is multi-architecture without emulation
# because the dependencies are installed on the build machine (see ops/docker/Dockerfile).
name: docker
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -f ops/docker/Dockerfile --build-arg VERSION=${{ github.ref_name }} -t quinvium-node:test .
      - name: Start and check the chain
        run: |
          docker run -d --name qu -p 127.0.0.1:8545:8545 quinvium-node:test
          for i in $(seq 1 60); do
            out=$(curl -s -X POST -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 || true)
            case "$out" in *'"result"'*) break;; esac
            sleep 2
          done
          echo "$out" | grep -q '"0xccb1"' || { docker logs qu; exit 1; }
          curl -s -X POST -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["0x0",false]}' http://127.0.0.1:8545 \
            | grep -q '0x49c889ad9d4f44869cf7f97a6e079a50dbf13974263b1afedec3b774ebeeac39' || { docker logs qu; exit 1; }
          curl -sf http://127.0.0.1:8545/ -o /dev/null
          docker exec qu id -u | grep -qv '^0$'
          docker logs qu | head -20
          docker stop -t 20 qu
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push (amd64, arm64)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=ghcr.io/lakylife/quinvium-node
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use --name qu
          docker buildx build -f ops/docker/Dockerfile --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .
