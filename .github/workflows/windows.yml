# Verification on real Windows: node tests, contracts and the miner build. On Linux additionally the bridge and tests without a browser.
# Actions are pinned to a commit hash: the v4 tag can be moved, the hash cannot.
name: windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test --workspace packages/node
      - run: npm test --workspace packages/contracts
      - run: cargo test --release --manifest-path packages/miner/Cargo.toml
      - run: cargo run --release --manifest-path packages/miner/Cargo.toml -- --list
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test --workspace packages/node
      - run: npm test --workspace packages/contracts
      - run: npm run build --workspace packages/contracts
      - run: node --test packages/bridge/test/relayer.test.js packages/bridge/test/bitcoin.test.js packages/bridge/test/btc-bridge.test.js
      - run: node --test packages/desktop/test/updater.test.cjs packages/desktop/test/cli-launcher.test.cjs packages/desktop/test/pool-offer.test.cjs packages/desktop/test/pool-url.test.cjs packages/desktop/test/release-check.test.cjs packages/desktop/test/share-node.test.cjs
      - run: node --test packages/explorer/test/design.test.mjs packages/explorer/test/i18n.test.mjs packages/explorer/test/pool-url.test.mjs packages/extension/test/i18n.test.cjs packages/extension/test/qr.test.cjs packages/extension/test/kinds.test.cjs packages/extension/test/local-rpc.test.cjs packages/extension/test/community-fallback.test.cjs
      - run: node --test packages/announcer/test/announcer.test.js packages/announcer/test/gatekeeper.test.js scripts/consensus-guard.test.mjs
      # Mobile layout: every website and Explorer page at phone, tablet and landscape sizes (no sideways scrolling, 16 px fields).
      - run: npx playwright install --with-deps chromium
      - run: node packages/website/src/build.mjs && node --test packages/website/test/i18n.test.mjs && node packages/website/test/mobile.mjs
      - run: node packages/explorer/test/mobile.mjs
