# Ověření na skutečných Windows: testy uzlu, kontrakty a sestavení mineru. Na Linuxu navíc most a testy bez prohlížeče.
# Akce jsou připnuté na otisk commitu: značka v4 se dá přesunout, otisk ne.
name: windows
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test --workspace packages/node
      - run: npm test --workspace packages/contracts
      - run: cargo test --release --manifest-path packages/miner/Cargo.toml
      - run: cargo run --release --manifest-path packages/miner/Cargo.toml -- --list
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test --workspace packages/node
      - run: npm test --workspace packages/contracts
      - run: npm run build --workspace packages/contracts
      - run: node --test packages/bridge/test/relayer.test.js packages/bridge/test/bitcoin.test.js packages/bridge/test/btc-bridge.test.js
      - run: node --test packages/desktop/test/updater.test.cjs packages/desktop/test/cli-launcher.test.cjs
      - run: node --test packages/explorer/test/design.test.mjs packages/explorer/test/i18n.test.mjs packages/extension/test/i18n.test.cjs packages/extension/test/kinds.test.cjs
