# quinvium.com on GitHub Pages. The website is published only from the protected main branch, exactly as committed
# (packages/website/public), so a server outage or a change made outside GitHub cannot alter it.
name: pages
on:
  push:
    branches: [main]
    paths: ['packages/website/public/**', '.github/workflows/pages.yml', 'ops/pages/nodes.mjs']
  # The site files stay as committed; only nodes.json (community nodes for an outage of our servers) is refreshed.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Site files
        run: |
          cp -r packages/website/public _site
          echo quinvium.com > _site/CNAME
      - name: Community nodes (nodes.json)
        run: node ops/pages/nodes.mjs --chain 52401 --genesis 0x49c889ad9d4f44869cf7f97a6e079a50dbf13974263b1afedec3b774ebeeac39 --rpc https://rpc.quinvium.com --previous https://quinvium.com/nodes.json --previous https://explorer.quinvium.com/nodes.json --out _site/nodes.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
