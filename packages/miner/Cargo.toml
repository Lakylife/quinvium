[package]
name = "quintium-miner"
version = "2.10.0"
edition = "2021"
description = "GPU miner sítě Quinvium (Ethash přes Vulkan, DirectX 12 a Metal)"
license = "MIT"

[dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"] }
pollster = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
serde_json = "1"
bytemuck = "1"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[workspace]
